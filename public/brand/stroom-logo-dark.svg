<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 86" width="100%" height="100%" fill="none">
  <!-- STROOM Official Logo (Dark for Light Backgrounds) -->
  <defs>
    <linearGradient id="stroomOrangeGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6900" />
      <stop offset="100%" stop-color="#E94B0B" />
    </linearGradient>
  </defs>

  <!-- Wordmark Letters: STR and M -->
  <text x="20" y="52" fill="#17120F" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" letter-spacing="1">STR</text>
  
  <!-- Integrated Infinity Loop (Natural double O) - Strictly NO decorative dashes -->
  <path d="M 166 35 C 180 18, 206 18, 212 35 C 218 52, 192 52, 166 35 C 140 18, 114 18, 120 35 C 126 52, 152 52, 166 35 Z" 
        fill="none" 
        stroke="url(#stroomOrangeGradDark)" 
        stroke-width="9.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <text x="222" y="52" fill="#17120F" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" letter-spacing="1">M</text>

  <!-- Subtitle: — STRANGERS ROOM — -->
  <line x1="22" y1="73" x2="82" y2="73" stroke="#241A14" stroke-width="2.5" stroke-linecap="round" />
  <text x="160" y="77" text-anchor="middle" fill="#241A14" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="9.5" letter-spacing="3.2">STRANGERS ROOM</text>
  <line x1="238" y1="73" x2="298" y2="73" stroke="#241A14" stroke-width="2.5" stroke-linecap="round" />
</svg>
